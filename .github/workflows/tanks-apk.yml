# Builds the Tank Battle Android app (a WebView around tanks/) and, on the default branch,
# publishes it as the "tanks-apk" release so phones can download tank-battle.apk directly.
name: Tank Battle APK

on:
  push:
    paths:
      - 'tanks/**'
      - '.github/workflows/tanks-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        working-directory: tanks/android
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          cp tanks/android/app/build/outputs/apk/release/app-release.apk tank-battle.apk
          unzip -l tank-battle.apk | grep -q 'assets/www/js/game.js'
          ls -l tank-battle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tank-battle-apk
          path: tank-battle.apk

      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view tanks-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tanks-apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "معركة الدبابات - نسخة أندرويد" \
              --notes "حمّل tank-battle.apk على جوال أندرويد وثبّته (اسمح بالتثبيت من مصادر غير معروفة عند السؤال)."
          fi
          gh release upload tanks-apk tank-battle.apk --repo "$GITHUB_REPOSITORY" --clobber
